<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="772" height="250">
<defs>
  <!-- Brand accent gradient -->
  <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#667eea"/>
    <stop offset="100%" stop-color="#764ba2"/>
  </linearGradient>
  <!-- Lighter/highlight accent -->
  <linearGradient id="accH" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8b9cf4"/>
    <stop offset="100%" stop-color="#9b6fcb"/>
  </linearGradient>
  <!-- Thumbnail gradients -->
  <linearGradient id="tg1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#667eea"/>
    <stop offset="100%" stop-color="#764ba2"/>
  </linearGradient>
  <linearGradient id="tg2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0891b2"/>
    <stop offset="100%" stop-color="#0e7490"/>
  </linearGradient>
  <linearGradient id="tg4" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <linearGradient id="tg5" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>
  <!-- Vertical separator gradient -->
  <linearGradient id="sepG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#667eea" stop-opacity="0"/>
    <stop offset="30%" stop-color="#667eea" stop-opacity="0.35"/>
    <stop offset="70%" stop-color="#764ba2" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- ===== BACKGROUND ===== -->
<rect width="772" height="250" fill="#1a1a2e"/>
<!-- Subtle ambient left glow -->
<circle cx="180" cy="125" r="220" fill="#667eea" fill-opacity="0.035"/>
<!-- Subtle ambient right glow -->
<circle cx="600" cy="125" r="180" fill="#764ba2" fill-opacity="0.05"/>
<!-- Top accent bar -->
<rect x="0" y="0" width="772" height="4" fill="url(#acc)"/>
<!-- Subtle bottom line -->
<rect x="0" y="247" width="772" height="3" fill="url(#acc)" fill-opacity="0.25"/>

<!-- ===== LEFT COLUMN — TEXT ===== -->
<text x="58" y="92"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="54" font-weight="800" letter-spacing="-1.5"
      fill="white">Smart Media</text>

<text x="58" y="146"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="54" font-weight="300" letter-spacing="-1"
      fill="white" fill-opacity="0.45">Manager</text>

<!-- What it does -->
<text x="60" y="180"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="15" font-weight="500"
      fill="white" fill-opacity="0.78">Media library folders and AI alt text</text>

<!-- Tagline -->
<text x="60" y="205"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="10.5" font-weight="400" letter-spacing="3"
      fill="white" fill-opacity="0.32">FOLDERS  ·  AI ALT TEXT  ·  BULK EDIT</text>

<!-- ===== SEPARATOR ===== -->
<rect x="440" y="0" width="1" height="250" fill="url(#sepG)"/>

<!-- ===== RIGHT COLUMN — FOLDER TREE + MEDIA GRID ===== -->
<ellipse cx="600" cy="125" rx="160" ry="100" fill="#667eea" fill-opacity="0.04"/>

<!-- Panel -->
<rect x="454" y="44" width="292" height="162" rx="10" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.10"/>
<rect x="582" y="44" width="1" height="162" fill="white" fill-opacity="0.08"/>

<!-- Folder tree -->
<path d="M470,63 h5 l2,2 h7 a1.5,1.5 0 0 1 1.5,1.5 v6 a1.5,1.5 0 0 1 -1.5,1.5 h-14 a1.5,1.5 0 0 1 -1.5,-1.5 v-8 a1.5,1.5 0 0 1 1.5,-1.5 z" fill="#8b9cf4"/>
<text x="492" y="71" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="white" fill-opacity="0.55">Products</text>
