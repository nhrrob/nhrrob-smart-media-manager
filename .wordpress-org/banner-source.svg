<text x="502" y="95" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="white" fill-opacity="0.92">Summer 2026</text>
<path d="M480,111 h5 l2,2 h7 a1.5,1.5 0 0 1 1.5,1.5 v6 a1.5,1.5 0 0 1 -1.5,1.5 h-14 a1.5,1.5 0 0 1 -1.5,-1.5 v-8 a1.5,1.5 0 0 1 1.5,-1.5 z" fill="#10b981"/>
<text x="502" y="119" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="white" fill-opacity="0.55">Lookbook</text>
<path d="M470,135 h5 l2,2 h7 a1.5,1.5 0 0 1 1.5,1.5 v6 a1.5,1.5 0 0 1 -1.5,1.5 h-14 a1.5,1.5 0 0 1 -1.5,-1.5 v-8 a1.5,1.5 0 0 1 1.5,-1.5 z" fill="#0891b2"/>
<text x="492" y="143" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="white" fill-opacity="0.55">Blog</text>
<path d="M470,159 h5 l2,2 h7 a1.5,1.5 0 0 1 1.5,1.5 v6 a1.5,1.5 0 0 1 -1.5,1.5 h-14 a1.5,1.5 0 0 1 -1.5,-1.5 v-8 a1.5,1.5 0 0 1 1.5,-1.5 z" fill="#e05a7a"/>
<text x="492" y="167" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="white" fill-opacity="0.55">Team</text>
<path d="M470,183 h5 l2,2 h7 a1.5,1.5 0 0 1 1.5,1.5 v6 a1.5,1.5 0 0 1 -1.5,1.5 h-14 a1.5,1.5 0 0 1 -1.5,-1.5 v-8 a1.5,1.5 0 0 1 1.5,-1.5 z" fill="#9b6fcb"/>
<text x="492" y="191" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="white" fill-opacity="0.55">Press kit</text>

<!-- Media grid -->
<rect x="596" y="58" width="64" height="46" rx="6" fill="url(#tg1)"/>
<path d="M596,104 L596,91 L614,78 L628,89 L642,76 L660,87 L660,104 Z" fill="white" fill-opacity="0.22"/>
<circle cx="607" cy="70" r="6" fill="white" fill-opacity="0.65"/>
<rect x="596" y="58" width="64" height="46" rx="6" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.12"/>
<rect x="668" y="58" width="64" height="46" rx="6" fill="url(#tg2)"/>
<path d="M668,104 L668,91 L686,78 L700,89 L714,76 L732,87 L732,104 Z" fill="white" fill-opacity="0.22"/>
<circle cx="679" cy="70" r="6" fill="white" fill-opacity="0.65"/>
