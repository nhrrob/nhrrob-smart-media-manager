<rect x="665" y="109" width="70" height="52" rx="8" fill="url(#accH)"/>
<rect x="668" y="112" width="64" height="46" rx="6" fill="url(#tg5)"/>
<path d="M668,158 L668,145 L686,132 L700,143 L714,130 L732,141 L732,158 Z" fill="white" fill-opacity="0.22"/>
<circle cx="679" cy="124" r="6" fill="white" fill-opacity="0.65"/>
<rect x="668" y="112" width="64" height="46" rx="6" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.12"/>

<!-- AI alt text chip -->
<rect x="596" y="170" width="136" height="24" rx="12" fill="url(#acc)"/>
<path d="M611,176 l1.6,4.4 l4.4,1.6 l-4.4,1.6 l-1.6,4.4 l-1.6,-4.4 l-4.4,-1.6 l4.4,-1.6 z" fill="white"/>
<text x="623" y="186" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="white">AI alt text added</text>
</svg>
